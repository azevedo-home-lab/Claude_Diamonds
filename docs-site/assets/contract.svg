<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The repo contract: /product publishes one-way through the gate into /plan, which feeds implementation; a spec-change issue is the only channel back.">
  <title>The repo contract — /product, /plan, one-way publish</title>
  <style>
    .prod  { fill:#f6ecdf; stroke:#a66a2e; stroke-width:1.4; }
    .plan  { fill:#eaf0f5; stroke:#3b5a78; stroke-width:1.4; }
    .impl  { fill:#e9f0e7; stroke:#5c7a5c; stroke-width:1.4; }
    .pname { fill:#a66a2e; font-size:13px; font-weight:700; }
    .lname { fill:#3b5a78; font-size:13px; font-weight:700; }
    .iname { fill:#5c7a5c; font-size:13px; font-weight:700; }
    .sub   { fill:#83868d; font-size:10px; }
    .glab  { fill:#a83232; font-size:9.5px; font-weight:700; letter-spacing:.05em; }
    .arrow { stroke:#83868d; stroke-width:1.3; fill:none; }
    .ah    { fill:#83868d; }
    .back  { stroke:#a83232; stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
    .bh    { fill:#a83232; }
    .blab  { fill:#a83232; font-size:9.5px; }
    @media (prefers-color-scheme: dark) {
      .prod  { fill:#2e2417; stroke:#d0975a; }
      .plan  { fill:#223038; stroke:#7ea3c2; }
      .impl  { fill:#1f2a20; stroke:#8fb28f; }
      .pname { fill:#d0975a; }
      .lname { fill:#7ea3c2; }
      .iname { fill:#8fb28f; }
      .sub   { fill:#83868d; }
      .glab  { fill:#d97a7a; }
      .back  { stroke:#d97a7a; }
      .bh    { fill:#d97a7a; }
      .blab  { fill:#d97a7a; }
    }
  </style>

  <rect class="prod" x="8" y="24" width="168" height="56" rx="10"/>
  <text class="pname" x="92"  y="47" text-anchor="middle">/product</text>
  <text class="sub"   x="92"  y="64" text-anchor="middle">canvas + memory — the why</text>

  <path class="arrow" d="M176 52 h56"/><path class="ah" d="M232 48 l8 4 -8 4 z"/>
  <text class="glab" x="208" y="40" text-anchor="middle">PUBLISH</text>
  <text class="glab" x="208" y="72" text-anchor="middle">ONE-WAY</text>

  <rect class="plan" x="244" y="24" width="168" height="56" rx="10"/>
  <text class="lname" x="328" y="47" text-anchor="middle">/plan</text>
  <text class="sub"   x="328" y="64" text-anchor="middle">stack.md · spec.md — decided</text>

  <path class="arrow" d="M412 52 h56"/><path class="ah" d="M468 48 l8 4 -8 4 z"/>

  <rect class="impl" x="480" y="24" width="152" height="56" rx="10"/>
  <text class="iname" x="556" y="47" text-anchor="middle">implementation</text>
  <text class="sub"   x="556" y="64" text-anchor="middle">src · tests · docs</text>

  <path class="back" d="M556 80 v22 H92 v-16"/><path class="bh" d="M88 90 l4 -8 4 8 z"/>
  <text class="blab" x="324" y="115" text-anchor="middle">spec-change issue — the only channel back</text>
</svg>
